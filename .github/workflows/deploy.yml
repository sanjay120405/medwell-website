name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into HTML files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUB_KEY: ${{ secrets.SUPABASE_PUB_KEY }}
        run: |
          for f in tracking.html admin.html task.html pricelist.html; do
            sed -i "s|%%SUPABASE_URL%%|$SUPABASE_URL|g" "$f"
            sed -i "s|%%SUPABASE_ANON_KEY%%|$SUPABASE_ANON_KEY|g" "$f"
          done
          sed -i "s|%%SUPABASE_URL%%|$SUPABASE_URL|g" customerlist.html
          sed -i "s|%%SUPABASE_PUB_KEY%%|$SUPABASE_PUB_KEY|g" customerlist.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,.git'
