<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Report – Medwell Logix Medical &amp; Surgical Equipment</title>
  <link rel="icon" type="image/png" href="medwell logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --teal:        #0D7A7A;
      --teal-dark:   #065A5A;
      --teal-deeper: #044040;
      --teal-light:  #E0F5F5;
      --orange:      #E87820;
      --orange-dark: #C56010;
      --white:       #FFFFFF;
      --off-white:   #F5FAFA;
      --dark:        #0F2A2A;
      --text:        #1A3A3A;
      --text-muted:  #5A7A7A;
      --border:      #C8E8E8;
      --shadow-sm:   0 2px 12px rgba(13,122,122,.08);
      --shadow-md:   0 8px 32px rgba(13,122,122,.14);
      --shadow-lg:   0 20px 60px rgba(13,122,122,.18);
      --radius-sm:   8px;
      --radius-md:   14px;
      --radius-lg:   22px;
      --transition:  0.3s cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--off-white); overflow-x: hidden; line-height: 1.6; }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--teal-light); }
    ::-webkit-scrollbar-thumb { background: var(--teal); border-radius: 99px; }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* NAVBAR */
    .navbar { position: sticky; top: 0; z-index: 1000; background: var(--white); box-shadow: 0 2px 20px rgba(13,122,122,.1); }
    .navbar-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 70px; gap: 20px; }
    .logo-wrap { justify-self: start; }
    .logo-wrap img { height: 50px; }
    .nav-links { display: none; align-items: center; justify-self: center; gap: 4px; }
    @media(min-width:900px){ .nav-links { display: flex; } }
    .nav-links a { font-family: 'Poppins', sans-serif; font-size: 0.88rem; font-weight: 500; color: var(--text); padding: 8px 14px; border-radius: var(--radius-sm); transition: var(--transition); position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 0; height: 2px; background: var(--teal); border-radius: 99px; transition: width .3s; }
    .nav-links a:hover::after, .nav-links a.active::after { width: 60%; }
    .nav-links a:hover, .nav-links a.active { color: var(--teal); }
    .hamburger { display: flex; flex-direction: column; gap: 6px; padding: 10px 11px; background: var(--teal-light); border-radius: var(--radius-sm); border: none; }
    @media(min-width:900px){ .hamburger { display: none; } }
    .hamburger span { display: block; width: 26px; height: 2.5px; background: var(--teal); border-radius: 99px; transition: var(--transition); }
    .hamburger.open span:nth-child(1){ transform: translateY(8.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2){ opacity: 0; }
    .hamburger.open span:nth-child(3){ transform: translateY(-8.5px) rotate(-45deg); }
    .mobile-menu { position: fixed; inset: 0; z-index: 999; background: var(--white); transform: translateX(100%); transition: transform .38s cubic-bezier(.4,0,.2,1); overflow-y: auto; padding: 24px; }
    .mobile-menu.open { transform: translateX(0); }
    .mobile-menu-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    .mobile-menu-close { width: 40px; height: 40px; border-radius: 50%; background: var(--teal-light); color: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; border: none; }
    .mobile-menu nav a { display: block; font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 500; color: var(--text); padding: 14px 0; border-bottom: 1px solid var(--border); }

    /* PAGE HERO */
    .page-hero { background: linear-gradient(135deg, var(--teal-deeper) 0%, var(--teal-dark) 60%, var(--teal) 100%); padding: 22px 0 24px; color: white; }
    .page-hero-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; opacity: .75; }
    .breadcrumb a { color: white; }
    .breadcrumb .current { color: var(--orange); }
    .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 800; line-height: 1.2; margin-top: 4px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); border-radius: var(--radius-sm); font-family: 'Poppins', sans-serif; font-size: 0.84rem; font-weight: 600; color: white; transition: background .2s; }
    .back-link:hover { background: rgba(255,255,255,.24); }

    /* CONTENT */
    .content-section { padding: 28px 0 60px; }
    .rpt-card { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); padding: 22px; margin-bottom: 22px; }
    .rpt-card h2 { font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 800; color: var(--dark); margin-bottom: 16px; }

    .rpt-filter-row, .rpt-search-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .rpt-filter-row select, .rpt-filter-row input, .rpt-search-row input { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--text); background: var(--off-white); }
    .rpt-filter-row select:focus, .rpt-filter-row input:focus, .rpt-search-row input:focus { outline: none; border-color: var(--teal); background: var(--white); }
    .rpt-search-row input { flex: 1; min-width: 180px; }
    .rpt-btn { display: flex; align-items: center; gap: 8px; padding: 10px 22px; background: var(--teal); color: white; border-radius: var(--radius-sm); font-family: 'Poppins', sans-serif; font-size: 0.88rem; font-weight: 600; border: none; cursor: pointer; transition: background .2s; white-space: nowrap; }
    .rpt-btn:hover { background: var(--teal-dark); }

    .rpt-stats-row { display: flex; gap: 28px; flex-wrap: wrap; padding: 16px 18px; background: var(--off-white); border-radius: var(--radius-sm); }
    .rpt-stat { display: flex; flex-direction: column; gap: 3px; }
    .rpt-stat-label { font-family: 'Poppins', sans-serif; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
    .rpt-stat-value { font-family: 'Poppins', sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--teal); }

    .rpt-bill-list { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .rpt-bill-card { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--white); }
    .rpt-bill-card:nth-child(even) { background: #f9fefe; }
    .rpt-bill-card:last-child { border-bottom: none; }
    .rpt-bill-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .rpt-bill-date { font-family: 'Poppins', sans-serif; font-size: 0.84rem; font-weight: 700; color: var(--dark); }
    .rpt-bill-total { font-family: 'Poppins', sans-serif; font-size: 0.92rem; font-weight: 800; color: var(--teal-dark); white-space: nowrap; }
    .rpt-bill-items { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }
    .rpt-bill-contact { font-size: 0.8rem; color: var(--teal-dark); margin-bottom: 5px; }
    .rpt-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.88rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="index.html" class="logo-wrap"><img src="medwell logo.png" alt="Medwell Logix" /></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="pricelist.html">Web Order</a>
        <a href="billing.html">Billing</a>
      </div>
      <div style="display:flex;align-items:center;gap:10px;justify-self:end;">
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </div>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-menu-header">
    <img src="medwell logo.png" alt="Medwell Logix" style="height:44px;" />
    <button class="mobile-menu-close" id="menuClose">✕</button>
  </div>
  <nav>
    <a href="index.html" onclick="closeMobileMenu()">Home</a>
    <a href="products.html" onclick="closeMobileMenu()">Products</a>
    <a href="pricelist.html" onclick="closeMobileMenu()">Web Order</a>
    <a href="billing.html" onclick="closeMobileMenu()">Billing</a>
  </nav>
</div>

<!-- PAGE HERO -->
<div class="page-hero">
  <div class="container">
    <div class="page-hero-inner">
      <div>
        <div class="breadcrumb">
          <a href="index.html">Home</a>
          <span>›</span>
          <a href="billing.html">Billing</a>
          <span>›</span>
          <span class="current">Report</span>
        </div>
        <h1>Billing Report</h1>
      </div>
      <a href="billing.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to Billing
      </a>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content-section">
  <div class="container">

    <div class="rpt-card">
      <h2>Overview</h2>
      <div class="rpt-filter-row">
        <select id="rptFilterType">
          <option value="day">Day</option>
          <option value="month">Month</option>
          <option value="year">Year</option>
          <option value="all">All Time</option>
        </select>
        <input type="date" id="rptDay" />
        <select id="rptMonth" style="display:none;">
          <option value="1">January</option><option value="2">February</option><option value="3">March</option>
          <option value="4">April</option><option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option><option value="9">September</option>
          <option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
        <input type="number" id="rptYear" min="2020" max="2035" placeholder="Year" style="display:none;width:100px;" />
        <button class="rpt-btn" id="rptApplyBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Apply
        </button>
      </div>
      <div class="rpt-stats-row">
        <div class="rpt-stat"><span class="rpt-stat-label">Total Sales</span><span class="rpt-stat-value" id="rptTotalSales">—</span></div>
        <div class="rpt-stat"><span class="rpt-stat-label">Total Customers</span><span class="rpt-stat-value" id="rptTotalCustomers">—</span></div>
        <div class="rpt-stat"><span class="rpt-stat-label">Total Bills</span><span class="rpt-stat-value" id="rptTotalBills">—</span></div>
      </div>
    </div>

    <div class="rpt-card">
      <h2>Customer Purchase History</h2>
      <div class="rpt-search-row">
        <input type="text" id="rptSearchName" placeholder="Search by customer name..." />
        <input type="tel" id="rptSearchPhone" placeholder="Search by phone number..." maxlength="10" inputmode="numeric" />
        <button class="rpt-btn" id="rptSearchBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Search
        </button>
      </div>
      <div class="rpt-stats-row" id="rptCustSummary" style="display:none;margin-bottom:16px;">
        <div class="rpt-stat"><span class="rpt-stat-label">Total Purchases</span><span class="rpt-stat-value" id="rptCustCount">—</span></div>
        <div class="rpt-stat"><span class="rpt-stat-label">Total Purchase Value</span><span class="rpt-stat-value" id="rptCustValue">—</span></div>
      </div>
      <div class="rpt-bill-list" id="rptResultsBox">
        <div class="rpt-empty">Loading…</div>
      </div>
    </div>

  </div>
</div>

<script>
  const SB_URL = 'https://vogxaylmrzulbdltxrwv.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvZ3hheWxtcnp1bGJkbHR4cnd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzIwNjksImV4cCI6MjA5Njg0ODA2OX0.ARbGKniGQzbwmLB93Vey3Mr2vXsLYZIlP4nJRMqhfts';
  const sb = window.supabase.createClient(SB_URL, SB_KEY);

  function escape(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // HAMBURGER
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
    document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
  });
  document.getElementById('menuClose').addEventListener('click', closeMobileMenu);
  function closeMobileMenu() {
    hamburger.classList.remove('open');
    mobileMenu.classList.remove('open');
    document.body.style.overflow = '';
  }

  // ── OVERVIEW: date filter + stats ──────────────────────────────
  document.getElementById('rptFilterType').addEventListener('change', () => {
    const type = document.getElementById('rptFilterType').value;
    document.getElementById('rptDay').style.display = type === 'day' ? '' : 'none';
    document.getElementById('rptMonth').style.display = type === 'month' ? '' : 'none';
    document.getElementById('rptYear').style.display = (type === 'month' || type === 'year') ? '' : 'none';
  });
  document.getElementById('rptApplyBtn').addEventListener('click', loadReportStats);

  function getReportDateRange() {
    const type = document.getElementById('rptFilterType').value;
    const now = new Date();
    let from, to;
    if (type === 'day') {
      const d = document.getElementById('rptDay').value || now.toISOString().slice(0, 10);
      from = new Date(d + 'T00:00:00');
      to = new Date(d + 'T23:59:59.999');
    } else if (type === 'month') {
      const month = +document.getElementById('rptMonth').value;
      const year = +document.getElementById('rptYear').value || now.getFullYear();
      from = new Date(year, month - 1, 1, 0, 0, 0);
      to = new Date(year, month, 0, 23, 59, 59, 999);
    } else if (type === 'year') {
      const year = +document.getElementById('rptYear').value || now.getFullYear();
      from = new Date(year, 0, 1, 0, 0, 0);
      to = new Date(year, 11, 31, 23, 59, 59, 999);
    } else {
      from = new Date(2000, 0, 1);
      to = new Date(2100, 0, 1);
    }
    return { from, to };
  }

  async function loadReportStats() {
    const { from, to } = getReportDateRange();
    document.getElementById('rptTotalSales').textContent = '…';
    document.getElementById('rptTotalCustomers').textContent = '…';
    document.getElementById('rptTotalBills').textContent = '…';
    const { data, error } = await sb.from('bills').select('customer_phone,total')
      .gte('created_at', from.toISOString()).lte('created_at', to.toISOString());
    if (error) {
      document.getElementById('rptTotalSales').textContent = 'Error';
      document.getElementById('rptTotalCustomers').textContent = 'Error';
      document.getElementById('rptTotalBills').textContent = 'Error';
      return;
    }
    const rows = data || [];
    const totalSales = rows.reduce((sum, r) => sum + (+r.total || 0), 0);
    const customers = new Set(rows.map(r => r.customer_phone));
    document.getElementById('rptTotalSales').textContent = '₹' + totalSales.toFixed(2);
    document.getElementById('rptTotalCustomers').textContent = customers.size;
    document.getElementById('rptTotalBills').textContent = rows.length;
  }

  // ── CUSTOMER PURCHASE HISTORY ───────────────────────────────────
  document.getElementById('rptSearchBtn').addEventListener('click', searchCustomerBills);
  ['rptSearchName', 'rptSearchPhone'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') searchCustomerBills(); });
  });

  async function searchCustomerBills() {
    const name    = document.getElementById('rptSearchName').value.trim();
    const phone   = document.getElementById('rptSearchPhone').value.trim();
    const box     = document.getElementById('rptResultsBox');
    const summary = document.getElementById('rptCustSummary');

    box.innerHTML = '<div class="rpt-empty">Loading…</div>';
    let query = sb.from('bills').select('*').order('created_at', { ascending: false });
    if (phone) query = query.eq('customer_phone', phone);
    if (name)  query = query.ilike('customer_name', `%${name}%`);
    if (!name && !phone) query = query.limit(200); // unfiltered: show recent bills, capped
    const { data, error } = await query;

    if (error) {
      box.innerHTML = `<div class="rpt-empty">Error: ${escape(error.message)}</div>`;
      summary.style.display = 'none';
      return;
    }

    const bills = data || [];
    if (!bills.length) {
      box.innerHTML = '<div class="rpt-empty">No bills yet.</div>';
      summary.style.display = 'none';
      return;
    }

    const totalValue = bills.reduce((sum, b) => sum + (+b.total || 0), 0);
    document.getElementById('rptCustCount').textContent = bills.length;
    document.getElementById('rptCustValue').textContent = '₹' + totalValue.toFixed(2);
    summary.style.display = 'flex';

    box.innerHTML = bills.map(b => {
      const date = new Date(b.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      const items = Array.isArray(b.items) ? b.items : [];
      const itemsText = items.map(it => `${it.name} × ${it.qty}`).join(', ') || 'No items recorded';
      const contactBits = [b.customer_phone, b.customer_address].filter(Boolean).map(escape).join(' · ');
      return `
        <div class="rpt-bill-card">
          <div class="rpt-bill-head">
            <span class="rpt-bill-date">${date} — ${escape(b.customer_name)}</span>
            <span class="rpt-bill-total">₹${(+b.total || 0).toFixed(2)}</span>
          </div>
          ${contactBits ? `<div class="rpt-bill-contact">${contactBits}</div>` : ''}
          <div class="rpt-bill-items">${escape(itemsText)}</div>
        </div>`;
    }).join('');
  }

  // Initial load
  document.getElementById('rptDay').value = new Date().toISOString().slice(0, 10);
  document.getElementById('rptYear').value = new Date().getFullYear();
  loadReportStats();
  searchCustomerBills();
</script>
</body>
</html>
